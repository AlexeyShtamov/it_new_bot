name: Post IT news to Telegram

on:
  schedule:
    # Каждый день в 09:00 UTC. Поменяй под себя — https://crontab.guru
    - cron: "0 9 * * *"
  workflow_dispatch: {} # чтобы можно было запустить руками из вкладки Actions

permissions:
  contents: write # нужно, чтобы закоммитить history.json обратно

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run poster
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          POST_LANGUAGE: "ru"
        run: python main.py

      - name: Save publication history
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add history.json
          git diff --staged --quiet || git commit -m "chore: update publication history"
          git push
